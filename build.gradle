plugins {
    id 'java'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.3'
    id 'com.gradleup.shadow' version '9.3.1'
}



ext {
    if (project.hasProperty('hytale_home')) {
        hytaleHome = project.findProperty('hytale_home')
    } else if (System.getenv('HYTALE_HOME')) {
        hytaleHome = System.getenv('HYTALE_HOME')
    } else {
        def osName = System.getProperty("os.name").toLowerCase()
        if (osName.contains('win')) {
            hytaleHome = "${System.getProperty("user.home")}/AppData/Roaming/Hytale"
        }
        else if (osName.contains('mac')) {
            hytaleHome = "${System.getProperty("user.home")}/Library/Application Support/Hytale"
        }
        else if (osName.contains('linux')) {
            hytaleHome = "${System.getProperty("user.home")}/.var/app/com.hypixel.HytaleLauncher/data/Hytale"
            if (!file(hytaleHome).exists()) {
                hytaleHome = "${System.getProperty("user.home")}/.local/share/Hytale"
            }
        }
    }
}

def hytaleHomePath = ext.has('hytaleHome') ? hytaleHome : null
def hasHytaleHome = (hytaleHomePath != null) && file(hytaleHomePath).exists()
if (!hasHytaleHome) {
    logger.lifecycle("Hytale install not detected; run configs that launch the server will be skipped. Set -Phytale_home=/path/to/Hytale to enable them.")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

// Quiet warnings about missing Javadocs.
javadoc {
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

// Adds the Hytale server as a build dependency, allowing you to reference and
// compile against their code without bundling it. When a local install is
// present, we still use its jar for launching the server in IDE run configs.
dependencies {
    compileOnly("com.hypixel.hytale:Server:$hytale_build")
    if (hasHytaleHome) {
        runtimeOnly(files("$hytaleHome/install/$patchline/package/game/latest/Server/HytaleServer.jar"))
    }

    // Your dependencies here

    // Ev0Lib — sibling mod providing HopperComponent API, etc.
    compileOnly(fileTree("$hytaleHome/UserData/Mods") { include "Ev0Lib-*.jar" })

    // HyUI — present as a separate mod at runtime; compileOnly keeps it off our classpath
    compileOnly("curse.maven:hyui-1431415:7603155")

    // ArcIO — optional redstone/signal automation library
    compileOnly("curse.maven:arcio-1473915:7692946")

    // EyeSpy — optional block/entity HUD overlay
    compileOnly(fileTree("$hytaleHome/UserData/Mods") { include "EyeSpy-*.jar" })

}

repositories {
    mavenCentral()
    maven {
        name = "hytale-release"
        url = uri("https://maven.hytale.com/release")
    }
    maven {
        name = "hytale-pre-release"
        url = uri("https://maven.hytale.com/pre-release")
    }
    maven {
        name = "cursemaven"
        url = uri("https://cursemaven.com")
    }
}

def sourceVariant = patchline == 'pre-release' ? 'pre-release' : 'release'
def artifactVariant = project.findProperty('artifact_suffix') ?: (sourceVariant == 'pre-release' ? 'prerelease' : '')
def releaseBuildVersion = '2026.03.26-89796e57b'
def prereleaseBuildVersion = '2026.04.02-51731a32a'
def releaseJarName = "${project.name}-${project.version}.jar"
def prereleaseJarName = "${project.name}-${project.version}-prerelease.jar"

sourceSets {
    main {
        java {
            srcDir("src/${sourceVariant}/java")
        }
    }
}

// Updates the manifest.json file with the latest properties defined in the
// build.properties file. Currently we update the version and if packs are
// included with the plugin.
tasks.register('updatePluginManifest') {
    def manifestFile = file('src/main/resources/manifest.json')
    doLast {
        
    }
}

// Makes sure the plugin manifest is up to date.
// Also strips BOM from all JSON resources so the built JAR is always clean.
tasks.named('processResources') {
    dependsOn 'updatePluginManifest'
    doLast {
        def resDir = sourceSets.main.output.resourcesDir
        fileTree(resDir).matching { include '**/*.json' }.each { f ->
            def bytes = f.bytes
            if (bytes.length >= 3 && bytes[0] == (byte)0xEF && bytes[1] == (byte)0xBB && bytes[2] == (byte)0xBF) {
                f.bytes = bytes[3..-1] as byte[]
                logger.lifecycle("Stripped BOM from: ${f.name}")
            }
        }
    }
}

tasks.named('jar') {
    archiveClassifier.set(artifactVariant)
}

tasks.named('shadowJar') {
    archiveClassifier.set(artifactVariant)
    mergeServiceFiles()
}

def gradleWrapperPath = org.gradle.internal.os.OperatingSystem.current().isWindows()
        ? file('gradlew.bat').absolutePath
        : file('gradlew').absolutePath

tasks.register('shadowJarRelease', Exec) {
    workingDir = projectDir
    commandLine gradleWrapperPath, '--no-daemon', '-Ppatchline=release', "-Phytale_build=${releaseBuildVersion}", 'shadowJar'
}

tasks.register('shadowJarPrerelease', Exec) {
    workingDir = projectDir
    commandLine gradleWrapperPath, '--no-daemon', '-Partifact_suffix=prerelease', '-Ppatchline=pre-release', "-Phytale_build=${prereleaseBuildVersion}", 'shadowJar'
}

tasks.register('buildRelease') {
    group = 'build'
    description = 'Builds the release shaded jar.'
    dependsOn 'shadowJarRelease'
}

tasks.register('buildPrerelease') {
    group = 'build'
    description = 'Builds the pre-release shaded jar.'
    dependsOn 'shadowJarPrerelease'
}

tasks.register('jarRelease', Exec) {
    group = 'build'
    description = 'Builds the release jar artifact (no shading).'
    workingDir = projectDir
    commandLine gradleWrapperPath, '--no-daemon', '-Partifact_suffix=release', '-Ppatchline=release', "-Phytale_build=${releaseBuildVersion}", 'jar'
}

tasks.register('jarPrerelease', Exec) {
    group = 'build'
    description = 'Builds the pre-release jar artifact (no shading).'
    workingDir = projectDir
    commandLine gradleWrapperPath, '--no-daemon', '-Partifact_suffix=prerelease', '-Ppatchline=pre-release', "-Phytale_build=${prereleaseBuildVersion}", 'jar'
}

// Ensure a normal build produces the current selected variant jar.
tasks.named('build') {
    dependsOn 'shadowJar'
}

if (hasHytaleHome) {
    // Create the working directory to run the server if it does not already exist.
    def serverRunDir = file("$projectDir/run")
    if (!serverRunDir.exists()) {
        serverRunDir.mkdirs()
    }

    def createServerRunArguments = { String srcDir ->
        def programParameters = '--allow-op --disable-sentry --assets="' + "${hytaleHome}/install/$patchline/package/game/latest/Assets.zip" + '"'
        def modPaths = []
        if (includes_pack.toBoolean()) {
            modPaths << srcDir
        }
        if (load_user_mods.toBoolean()) {
            modPaths << "${hytaleHome}/UserData/Mods"
        }
        if (!modPaths.isEmpty()) {
            programParameters += ' --mods="' + modPaths.join(',') + '"'
        }
        return programParameters
    }

    def serverJar = file("$hytaleHome/install/$patchline/package/game/latest/Server/HytaleServer.jar")
    def assetsZip = file("$hytaleHome/install/$patchline/package/game/latest/Assets.zip")
    def shadowJarTask = tasks.named('shadowJar')

    tasks.register('runServerJar', JavaExec) {
        dependsOn shadowJarTask
        mainClass = 'com.hypixel.hytale.Main'
        classpath = files(serverJar)
        workingDir = serverRunDir.absolutePath
        doFirst {
            def modPaths = [shadowJarTask.get().archiveFile.get().asFile.absolutePath]
            if (load_user_mods.toBoolean()) {
                modPaths << "${hytaleHome}/UserData/Mods"
            }
            setArgs([
                    '--allow-op',
                    '--disable-sentry',
                    "--assets=${assetsZip}",
                    "--mods=${modPaths.join(',')}"
            ])
        }
    }

    tasks.register('runServer') {
        dependsOn 'runServerJar'
    }

    def installedJarName = "${project.name}-${project.version}.jar"

    tasks.register('deployReleaseMod') {
        dependsOn 'jarRelease'
        doLast {
            def jarFile = layout.buildDirectory.file("libs/${releaseJarName}").get().asFile
            def modsDir = file("$hytaleHome/UserData/Mods")
            if (!modsDir.exists()) modsDir.mkdirs()
            delete(file("$modsDir/${installedJarName}"))
            copy {
                from jarFile
                into modsDir
                rename { installedJarName }
            }
            logger.lifecycle("Deployed ${jarFile.name} -> ${modsDir}/${installedJarName}")
        }
    }

    tasks.register('deployPrereleaseMod') {
        dependsOn 'jarPrerelease'
        doLast {
            def jarFile = layout.buildDirectory.file("libs/${prereleaseJarName}").get().asFile
            def modsDir = file("$hytaleHome/UserData/Mods")
            if (!modsDir.exists()) modsDir.mkdirs()
            delete(file("$modsDir/${installedJarName}"))
            copy {
                from jarFile
                into modsDir
                rename { installedJarName }
            }
            logger.lifecycle("Deployed ${jarFile.name} -> ${modsDir}/${installedJarName}")
        }
    }

    tasks.register('deployMod') {
        dependsOn 'deployReleaseMod'
    }

    // Creates a run configuration in IDEA that will run the Hytale server with
    // your plugin and the default assets.
    idea.project.settings.runConfigurations {
        'HytaleServer'(org.jetbrains.gradle.ext.Application) {
            mainClass = 'com.hypixel.hytale.Main'
            moduleName = project.idea.module.name + '.main'
            programParameters = createServerRunArguments(sourceSets.main.java.srcDirs.first().parentFile.absolutePath)
            workingDirectory = serverRunDir.absolutePath
        }
    }

    // Creates a launch.json file for VSCode with the same configuration
    tasks.register('generateVSCodeLaunch') {
        def vscodeDir = file("$projectDir/.vscode")
        def launchFile = file("$vscodeDir/launch.json")
        doLast {
            if (!vscodeDir.exists()) {
                vscodeDir.mkdirs()
            }
            def programParams = createServerRunArguments("\${workspaceFolder}")
            def launchConfig = [
                    version: "0.2.0",
                    configurations: [
                            [
                                    type: "java",
                                    name: "HytaleServer",
                                    request: "launch",
                                    mainClass: "com.hypixel.hytale.Main",
                                    args: programParams,
                                    cwd: "\${workspaceFolder}/run"
                            ]
                    ]
            ]
            launchFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(launchConfig))
        }
    }
} else {
    tasks.register('generateVSCodeLaunch') {
        doLast {
            logger.lifecycle("Skipped VSCode launch configuration because hytale_home is not set or the install path is missing.")
        }
    }
}
